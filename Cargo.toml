[package]
name = "demo_auth"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8.9", features = ["tokio"] }
serde = { version = "1.0.229", features = ["serde_derive", "derive"] }
diesel = { version = "2.2.0", features = ["postgres", "uuid", "chrono"] }
diesel-async = { version = "0.9.2", features = ["bb8", "postgres"]}
jsonwebtoken = "11.0.0"
openssl = "0.10.81"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"